# Docker image build and publish for the Lucoze marketing website.
#
# TRIGGER: GitHub Release published in this repo.
#   uat-vX.Y.Z  →  UAT build   → svasamm/lucoze-website:uat-vX.Y.Z + :uat-latest  → UAT deploy
#   vX.Y.Z      →  Prod build  → svasamm/lucoze-website:vX.Y.Z + :latest           → Production deploy (approval gate)
#
# Can also be triggered manually via workflow_dispatch for infra rebuilds, and
# runs weekly (schedule) to rebuild+redeploy prod so drip-published (future-dated)
# blog posts go live on/after their date — see src/lib/posts.ts.
#
# Flow:
#   Create GitHub Release tagged uat-v1.0.0
#     → builds uat-v1.0.0 + uat-latest tags
#       → triggers Dokploy webhook for UAT site
#
# Required GitHub Secrets:
#   DOCKERHUB_USERNAME              Docker Hub username
#   DOCKERHUB_TOKEN                 Docker Hub token (read+write)
#   DOKPLOY_LUCOZE_WEBSITE_WEBHOOK      Dokploy deploy webhook for production
#   DOKPLOY_LUCOZE_WEBSITE_UAT_WEBHOOK  Dokploy deploy webhook for UAT
#
# Required GitHub Variables:
#   DOKPLOY_DEPLOY_ENABLED          set to "true" to enable auto-deploy after build

name: Build & Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. uat-v1.0.0 or v1.0.0). Defaults to 'uat-latest' for manual infra rebuilds."
        required: false
        default: "uat-latest"
        type: string
  schedule:
    # Weekly PROD rebuild (Mondays 02:00 UTC). Blog posts are drip-published:
    # a future-dated post only builds once its date <= build time (see
    # src/lib/posts.ts). This rebuild re-evaluates that at the current date and
    # redeploys :latest from main, so scheduled posts go live on/after their date
    # without a manual release. No-op when nothing new is due (same image content).
    - cron: "0 2 * * 1"

jobs:
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      is_uat: ${{ steps.meta.outputs.is_uat }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version and environment
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_TAG:-$INPUT_VERSION}"
          # schedule event carries no release tag or input → rebuild the prod
          # floating tag (releases any drip-published posts now past their date).
          VERSION="${VERSION:-latest}"

          if echo "$VERSION" | grep -q "^uat-"; then
            FLOATING_TAG="uat-latest"
            IS_UAT="true"
          else
            FLOATING_TAG="latest"
            IS_UAT="false"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "floating_tag=${FLOATING_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_uat=${IS_UAT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve environment URLs
        id: urls
        env:
          IS_UAT: ${{ steps.meta.outputs.is_uat }}
        run: |
          if [ "$IS_UAT" = "true" ]; then
            echo "billing_api_url=https://admin-uat.lucoze.com" >> "$GITHUB_OUTPUT"
            echo "admin_api_url=https://admin-uat.lucoze.com" >> "$GITHUB_OUTPUT"
            # UAT: leave Plausible domain empty so the script tag is not rendered;
            # UAT visits will not be reported to Plausible.
            echo "plausible_domain=" >> "$GITHUB_OUTPUT"
            # UAT: leave GA4 empty too — no gtag, no consent banner, and UAT
            # traffic stays out of the production property.
            echo "ga_id=" >> "$GITHUB_OUTPUT"
            # set once Listmonk (marketing.lucoze.com) + list UUID exist; empty keeps the subscribe form gated off
            echo "marketing_url=" >> "$GITHUB_OUTPUT"
            echo "newsletter_list_uuid=" >> "$GITHUB_OUTPUT"
          else
            echo "billing_api_url=https://admin.lucoze.com" >> "$GITHUB_OUTPUT"
            echo "admin_api_url=https://admin.lucoze.com" >> "$GITHUB_OUTPUT"
            echo "plausible_domain=lucoze.com" >> "$GITHUB_OUTPUT"
            # GA4 measurement ID is public (it ships in every page's HTML), so it
            # lives here rather than in a secret — same as plausible_domain.
            echo "ga_id=G-8PKQ5SH09G" >> "$GITHUB_OUTPUT"
            # set once Listmonk (marketing.lucoze.com) + list UUID exist; empty keeps the subscribe form gated off
            echo "marketing_url=" >> "$GITHUB_OUTPUT"
            echo "newsletter_list_uuid=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            PUBLIC_BILLING_API_URL=${{ steps.urls.outputs.billing_api_url }}
            PUBLIC_ADMIN_API_URL=${{ steps.urls.outputs.admin_api_url }}
            PUBLIC_PLAUSIBLE_DOMAIN=${{ steps.urls.outputs.plausible_domain }}
            PUBLIC_GA_ID=${{ steps.urls.outputs.ga_id }}
            PUBLIC_MARKETING_URL=${{ steps.urls.outputs.marketing_url }}
            PUBLIC_NEWSLETTER_LIST_UUID=${{ steps.urls.outputs.newsletter_list_uuid }}
          tags: |
            svasamm/lucoze-website:${{ steps.meta.outputs.version }}
            svasamm/lucoze-website:${{ steps.meta.outputs.floating_tag }}
          cache-from: type=gha,key=lucoze-website-${{ steps.meta.outputs.floating_tag }}
          cache-to: type=gha,mode=max,key=lucoze-website-${{ steps.meta.outputs.floating_tag }}

      - name: Job summary
        run: |
          echo "### Docker image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version tag:** \`svasamm/lucoze-website:${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Floating tag:** \`svasamm/lucoze-website:${{ steps.meta.outputs.floating_tag }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-uat:
    name: Deploy to UAT
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.is_uat == 'true' && vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    environment: uat

    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_LUCOZE_WEBSITE_UAT_WEBHOOK }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DOKPLOY_LUCOZE_WEBSITE_UAT_WEBHOOK not set — skipping deploy."
            exit 0
          fi

          echo "Deploying to UAT..."
          echo "Image: $IMAGE_TAG"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "Webhook returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Deploy summary
        if: always()
        run: |
          echo "### UAT Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ needs.build.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Site**: lucoze-website UAT" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.outputs.is_uat == 'false' && vars.DOKPLOY_DEPLOY_ENABLED == 'true'
    environment: production

    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_LUCOZE_WEBSITE_WEBHOOK }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DOKPLOY_LUCOZE_WEBSITE_WEBHOOK not set — skipping deploy."
            exit 0
          fi

          echo "Deploying to production..."
          echo "Image: $IMAGE_TAG"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" -H "Content-Type: application/json")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Deploy triggered (HTTP $HTTP_STATUS)"
          else
            echo "Webhook returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Ping IndexNow
        # Pushes the live sitemap's URLs to IndexNow (Bing + Yandex; Bing also
        # backs ChatGPT search) so new/changed pages are re-crawled in minutes
        # instead of waiting to be discovered. Google ignores IndexNow — it
        # relies on the sitemap. Best-effort: never fails the deploy.
        continue-on-error: true
        env:
          # Key file is served at https://lucoze.com/<key>.txt (public/).
          INDEXNOW_KEY: 306b0ac5270df87304cfd553d6a44963
          HOST: lucoze.com
        run: |
          # Let Dokploy pull + restart so we submit THIS release's sitemap.
          sleep 90

          if ! curl -sf --max-time 30 "https://${HOST}/sitemap-0.xml" -o sitemap.xml; then
            echo "Could not fetch sitemap — skipping IndexNow ping."
            exit 0
          fi

          grep -o '<loc>[^<]*</loc>' sitemap.xml \
            | sed -e 's|<loc>||' -e 's|</loc>||' > urls.txt
          echo "Submitting $(wc -l < urls.txt) URLs to IndexNow"

          jq -n --arg host "$HOST" --arg key "$INDEXNOW_KEY" --rawfile urls urls.txt \
            '{host: $host, key: $key,
              keyLocation: ("https://" + $host + "/" + $key + ".txt"),
              urlList: ($urls | split("\n") | map(select(length > 0)))}' > payload.json

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data @payload.json)
          # 200 = accepted, 202 = accepted pending key validation.
          echo "IndexNow responded HTTP $STATUS"

      - name: Deploy summary
        if: always()
        run: |
          echo "### Production Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: \`${{ needs.build.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Site**: lucoze-website Production" >> "$GITHUB_STEP_SUMMARY"
