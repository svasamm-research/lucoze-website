name: Tests

on:
  push:
    branches: [main, develop, uat]
  pull_request:

jobs:
  test:
    name: Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    # Playwright's own image: the approved screenshots were taken in it, and a plain
    # ubuntu runner's fonts would fail them for no real reason.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - run: npm ci --ignore-scripts

      - name: Run E2E smoke tests
        # The Playwright config's webServer builds + serves the site, so this
        # runs against the real static output.
        run: npm run test:e2e

      # A red screenshot test is read from its picture, not guessed at: keep the
      # expected / actual / diff images of every failure for a week.
      - name: Keep the failure pictures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7

  infra:
    name: nginx Infra Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npm run build

      - name: Check redirects + security headers
        run: bash scripts/check-nginx.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          exit-code: "1"
