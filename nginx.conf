server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik (TLS terminates upstream), keep redirects relative so the
    # https scheme is preserved — otherwise 301s emit an absolute http:// URL.
    absolute_redirect off;

    # Don't advertise the nginx version in Server headers / error pages.
    server_tokens off;

    # Canonical host: www → apex, 301, path preserved. Traefik forwards the
    # original Host header, so nginx can do this reliably (no Traefik middleware
    # / router-name guessing). Explicit absolute https URL is intentional here.
    if ($host = www.lucoze.com) {
        return 301 https://lucoze.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS. Traefik terminates TLS and relays this header to the browser over
    # HTTPS, so the browser honors it. Host-only for now (safe). Upgrade to
    # "; includeSubDomains" once every *.lucoze.com (app, manager, analytics,
    # status, uat…) is confirmed HTTPS-only, then add "; preload" and submit to
    # hstspreload.org — both are hard to reverse, so verify first.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Content-Security-Policy. Enumerates every origin the site actually talks to:
    #   - self-hosted fonts → font-src 'self' (no external font host any more)
    #   - gtag from googletagmanager, beacons to *.google-analytics.com
    #   - self-hosted Plausible at analytics.lucoze.com
    #   - lead form + visitor tracker POST to admin(.|-uat.)lucoze.com
    # 'unsafe-inline' is required for now because the consent/gtag/Plausible-stub
    # and Astro scoped styles are inline (no nonces yet). object-src none +
    # base-uri self + frame-ancestors self still harden the common XSS vectors.
    # NOTE: GA/Plausible only load on prod (empty on UAT), so those origins can
    # only be verified against the live site — check the browser console after a
    # prod deploy that no beacon/form request is CSP-blocked.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.googletagmanager.com https://analytics.lucoze.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://stats.g.doubleclick.net; connect-src 'self' https://analytics.lucoze.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://admin.lucoze.com https://admin-uat.lucoze.com; media-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://admin.lucoze.com https://admin-uat.lucoze.com; object-src 'none'" always;

    # Apex → canonical India homepage as a real 301 (Astro's static build only
    # emits a meta-refresh stub for "/", which passes link equity weakly).
    location = / {
        return 301 /in/;
    }

    # Legacy hyphenated solution URLs → real 301 to the canonical nested paths.
    # Astro previously emitted meta-refresh + noindex stubs for these, which
    # robots.txt then Disallowed — so Googlebot could never crawl in to see the
    # noindex. A real 301 here (and dropping the Disallow) fixes both. Handles
    # slash and no-slash in one hop; regex runs before the prefix location below.
    location ~ ^/in/solutions-(clinics|hospitals)/?$ {
        return 301 /in/solutions/$1/;
    }

    # Astro generates /page/index.html for clean URLs
    # try_files handles: /about → /about/index.html → /about.html
    location / {
        # Canonicalise to a trailing slash: 301 extensionless, non-slash paths
        # (e.g. /in/locations → /in/locations/) so both URL forms don't return
        # 200 and split crawl budget. $uri excludes the query; $is_args$args
        # re-appends it. Files with an extension and the apex are untouched.
        if ($uri ~ ^(.*/[^/.]+)$) {
            return 301 $1/$is_args$args;
        }
        try_files $uri $uri/index.html $uri.html =404;
    }

    # CSS, JS, and image assets — 1 year cache (Astro hashes filenames)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
