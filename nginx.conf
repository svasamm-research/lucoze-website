server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik (TLS terminates upstream), keep redirects relative so the
    # https scheme is preserved — otherwise 301s emit an absolute http:// URL.
    absolute_redirect off;

    # Canonical host: www → apex, 301, path preserved. Traefik forwards the
    # original Host header, so nginx can do this reliably (no Traefik middleware
    # / router-name guessing). Explicit absolute https URL is intentional here.
    if ($host = www.lucoze.com) {
        return 301 https://lucoze.com$request_uri;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS. Traefik terminates TLS and relays this header to the browser over
    # HTTPS, so the browser honors it. Host-only for now (safe). Upgrade to
    # "; includeSubDomains" once every *.lucoze.com (app, manager, analytics,
    # status, uat…) is confirmed HTTPS-only, then add "; preload" and submit to
    # hstspreload.org — both are hard to reverse, so verify first.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Apex → canonical India homepage as a real 301 (Astro's static build only
    # emits a meta-refresh stub for "/", which passes link equity weakly).
    location = / {
        return 301 /in/;
    }

    # Astro generates /page/index.html for clean URLs
    # try_files handles: /about → /about/index.html → /about.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # CSS, JS, and image assets — 1 year cache (Astro hashes filenames)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
