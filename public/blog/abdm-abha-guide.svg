<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="How ABDM connects ABHA (patient), HPR (professionals), and HFR (facilities) on consent-based rails">
  <!-- Background: warm paper -->
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <!-- Left terracotta accent strip -->
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>

  <!-- Eyebrow: vault mark + label -->
  <g transform="translate(72 64)">
    <rect x="0" y="0" width="54" height="54" rx="12" ry="12" fill="#c15f3c"/>
    <circle cx="16" cy="16" r="4.2" fill="#f4f3ee"/>
    <circle cx="16" cy="27" r="4.2" fill="#f4f3ee"/>
    <circle cx="16" cy="38" r="4.2" fill="#f4f3ee"/>
    <circle cx="27" cy="38" r="4.2" fill="#f4f3ee"/>
    <circle cx="38" cy="38" r="4.2" fill="#f4f3ee"/>
    <text x="72" y="24" font-family="'JetBrains Mono','Menlo',monospace" font-size="15" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="72" y="46" font-family="'JetBrains Mono','Menlo',monospace" font-size="13" letter-spacing="1.4" fill="#726d65">ABDM &amp; ABHA · EXPLAINED</text>
  </g>

  <!-- Title -->
  <g transform="translate(72 176)" font-family="'Manrope','Inter Tight',system-ui,sans-serif">
    <text x="0" y="0" font-size="52" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">ABDM, in one picture.</text>
    <text x="0" y="42" font-size="21" fill="#625c54">Not a database — a set of consent-based rails that let health records follow the patient.</text>
  </g>

  <!-- Diagram: central ABDM hub with three connected registries -->
  <!-- Connector lines (drawn first, sit behind nodes) -->
  <g stroke="#c9a68f" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round" fill="none">
    <path d="M600 360 L250 470"/>
    <path d="M600 360 L600 464"/>
    <path d="M600 360 L950 470"/>
  </g>

  <!-- Central hub: ABDM -->
  <g transform="translate(468 316)">
    <rect x="0" y="0" width="264" height="88" rx="18" ry="18" fill="#c15f3c"/>
    <text x="132" y="38" text-anchor="middle" font-family="'Manrope',sans-serif" font-size="26" font-weight="800" letter-spacing="0.5" fill="#f4f3ee">ABDM</text>
    <text x="132" y="64" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="0.8" fill="#f4d9cd">consent-based health-data rails</text>
  </g>

  <!-- Node: ABHA (patient) -->
  <g transform="translate(96 464)">
    <rect x="0" y="0" width="308" height="96" rx="16" ry="16" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
    <circle cx="42" cy="48" r="20" fill="none" stroke="#c15f3c" stroke-width="2.5"/>
    <circle cx="42" cy="41" r="7" fill="#c15f3c"/>
    <path d="M28 58 a14 12 0 0 1 28 0" fill="#c15f3c"/>
    <text x="80" y="40" font-family="'Manrope',sans-serif" font-size="20" font-weight="800" fill="#1f1d1a">ABHA</text>
    <text x="80" y="64" font-family="'Inter Tight',sans-serif" font-size="14" fill="#625c54">The patient's health ID</text>
  </g>

  <!-- Node: HPR (professionals) -->
  <g transform="translate(446 464)">
    <rect x="0" y="0" width="308" height="96" rx="16" ry="16" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
    <g transform="translate(24 26)" stroke="#c15f3c" stroke-width="2.5" fill="none">
      <path d="M6 4 v14 a12 12 0 0 0 24 0 V4"/>
      <circle cx="6" cy="4" r="3" fill="#c15f3c" stroke="none"/>
      <circle cx="30" cy="4" r="3" fill="#c15f3c" stroke="none"/>
      <path d="M18 30 v6 a8 8 0 0 0 8 8"/>
      <circle cx="30" cy="46" r="5"/>
    </g>
    <text x="80" y="40" font-family="'Manrope',sans-serif" font-size="20" font-weight="800" fill="#1f1d1a">HPR</text>
    <text x="80" y="64" font-family="'Inter Tight',sans-serif" font-size="14" fill="#625c54">Registry of professionals</text>
  </g>

  <!-- Node: HFR (facilities) -->
  <g transform="translate(796 464)">
    <rect x="0" y="0" width="308" height="96" rx="16" ry="16" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
    <g transform="translate(24 28)" stroke="#c15f3c" stroke-width="2.5" fill="none">
      <rect x="4" y="4" width="36" height="36" rx="4"/>
      <path d="M22 12 v16 M14 20 h16" stroke-width="3"/>
    </g>
    <text x="80" y="40" font-family="'Manrope',sans-serif" font-size="20" font-weight="800" fill="#1f1d1a">HFR</text>
    <text x="80" y="64" font-family="'Inter Tight',sans-serif" font-size="14" fill="#625c54">Registry of facilities</text>
  </g>
</svg>
