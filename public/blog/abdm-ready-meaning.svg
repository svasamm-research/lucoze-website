<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="What 'ABDM-ready' actually means, as four capabilities to check for: issues and links ABHA, registered on HFR and HPR, consent-based record sharing, and standards-based (FHIR) records.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">ABDM · PROCUREMENT</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">What "ABDM-ready" really means.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">Four capabilities to check before a vendor's badge means anything.</text>
  </g>
  <!-- checklist rows -->
  <g transform="translate(72 268)" font-family="'Manrope',sans-serif">
    <g transform="translate(0 0)">
      <rect width="516" height="60" rx="12" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="34" cy="30" r="15" fill="#c15f3c"/><path d="M27 30 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="37" font-size="17" font-weight="700" fill="#1f1d1a">Issues &amp; links ABHA for patients</text>
    </g>
    <g transform="translate(0 74)">
      <rect width="516" height="60" rx="12" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="34" cy="30" r="15" fill="#c15f3c"/><path d="M27 30 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="37" font-size="17" font-weight="700" fill="#1f1d1a">Registered on HFR &amp; HPR</text>
    </g>
    <g transform="translate(548 0)">
      <rect width="516" height="60" rx="12" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="34" cy="30" r="15" fill="#c15f3c"/><path d="M27 30 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="37" font-size="17" font-weight="700" fill="#1f1d1a">Consent-based record sharing</text>
    </g>
    <g transform="translate(548 74)">
      <rect width="516" height="60" rx="12" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="34" cy="30" r="15" fill="#c15f3c"/><path d="M27 30 l5 5 l9 -10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="37" font-size="17" font-weight="700" fill="#1f1d1a">Standards-based (FHIR) records</text>
    </g>
  </g>
  <text transform="translate(72 468)" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="0.5" fill="#9a6a52">Miss any one, and "ABDM-ready" is just a sticker.</text>
</svg>
