<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="One ABHA, two parts: a 14-digit ABHA number that identifies the patient, and an ABHA address, a self-chosen handle used to receive and share records.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">ABDM · ABHA</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">One account, two things.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">A patient's ABHA has a 14-digit number and a self-chosen address — they're not the same.</text>
  </g>
  <!-- number card -->
  <g transform="translate(72 288)">
    <rect x="0" y="0" width="510" height="200" rx="16" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
    <text x="28" y="46" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="1.2" fill="#9a8f80">ABHA NUMBER</text>
    <text x="28" y="102" font-family="'JetBrains Mono',monospace" font-size="34" font-weight="700" fill="#1f1d1a">12-3456-7890-1234</text>
    <text x="28" y="140" font-family="'Manrope',sans-serif" font-size="18" font-weight="700" fill="#1f1d1a">The 14-digit ID</text>
    <text x="28" y="168" font-family="'Inter Tight',sans-serif" font-size="15" fill="#625c54">Permanent, unique to the patient — like an account number.</text>
  </g>
  <!-- address card -->
  <g transform="translate(618 288)">
    <rect x="0" y="0" width="490" height="200" rx="16" fill="#c15f3c"/>
    <text x="28" y="46" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="1.2" fill="#f6d9cd">ABHA ADDRESS</text>
    <text x="28" y="102" font-family="'JetBrains Mono',monospace" font-size="34" font-weight="700" fill="#fff">ananya@abdm</text>
    <text x="28" y="140" font-family="'Manrope',sans-serif" font-size="18" font-weight="700" fill="#fff">The handle</text>
    <text x="28" y="168" font-family="'Inter Tight',sans-serif" font-size="15" fill="#f6ded3">A username you share to receive &amp; consent — like a UPI ID.</text>
  </g>
</svg>
