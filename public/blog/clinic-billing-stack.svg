<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A clinic's four billing motions — OPD consultation, pharmacy, packages and discounts — all reconciling into one day-sheet.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">BILLING &amp; GST</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">Four kinds of billing, one day.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">When every motion writes to the same ledger, the day reconciles itself.</text>
  </g>
  <!-- four sources converging to one day-sheet -->
  <g transform="translate(72 268)" font-family="'Manrope',sans-serif">
    <!-- connectors -->
    <g stroke="#c9a68f" stroke-width="2" fill="none">
      <path d="M300 40 C420 40 450 140 640 140"/>
      <path d="M300 118 C430 118 460 150 640 150"/>
      <path d="M300 196 C430 196 460 160 640 160"/>
      <path d="M300 274 C420 274 450 180 640 180"/>
    </g>
    <!-- source cards -->
    <g font-size="16" font-weight="700" fill="#1f1d1a">
      <g transform="translate(0 16)"><rect width="300" height="48" rx="10" fill="#fffdf7" stroke="#e2e0d8"/><text x="20" y="30">Consultation / OPD</text></g>
      <g transform="translate(0 94)"><rect width="300" height="48" rx="10" fill="#fffdf7" stroke="#e2e0d8"/><text x="20" y="30">Pharmacy point-of-sale</text></g>
      <g transform="translate(0 172)"><rect width="300" height="48" rx="10" fill="#fffdf7" stroke="#e2e0d8"/><text x="20" y="30">Packages &amp; advances</text></g>
      <g transform="translate(0 250)"><rect width="300" height="48" rx="10" fill="#fffdf7" stroke="#e2e0d8"/><text x="20" y="30">Discounts</text></g>
    </g>
    <!-- day-sheet -->
    <g transform="translate(640 96)">
      <rect width="360" height="128" rx="16" fill="#c15f3c"/>
      <text x="30" y="48" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="1" fill="#f6ded3">END OF DAY</text>
      <text x="30" y="84" font-size="26" font-weight="800" fill="#fff">One day-sheet</text>
      <text x="30" y="110" font-family="'Inter Tight',sans-serif" font-size="15" fill="#f6ded3">Cash + card + UPI = system total</text>
    </g>
  </g>
</svg>
