<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="The DHIS incentive flow: a hospital creates an ABHA-linked record, the National Health Authority processes it, and pays an incentive per qualifying transaction.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">ABDM · DIGITAL HEALTH INCENTIVE SCHEME</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">ABDM can pay for going digital.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">Under DHIS, qualifying ABHA-linked records earn a per-transaction incentive from the NHA.</text>
  </g>
  <g transform="translate(72 312)" font-family="'Manrope',sans-serif">
    <g font-size="30" fill="#c9a68f"><text x="316" y="66">→</text><text x="700" y="66">→</text></g>
    <g transform="translate(0 0)">
      <rect width="290" height="108" rx="14" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <text x="24" y="44" font-size="18" font-weight="800" fill="#1f1d1a">You create a record</text>
      <text x="24" y="74" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">ABHA-linked, with consent</text>
    </g>
    <g transform="translate(374 0)">
      <rect width="290" height="108" rx="14" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <text x="24" y="44" font-size="18" font-weight="800" fill="#1f1d1a">NHA counts it</text>
      <text x="24" y="74" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">Above a monthly threshold</text>
    </g>
    <g transform="translate(748 0)">
      <rect width="360" height="108" rx="14" fill="#c15f3c"/>
      <text x="24" y="44" font-size="18" font-weight="800" fill="#fff">Incentive paid</text>
      <text x="24" y="74" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#f6ded3">Per qualifying transaction · capped</text>
      <text x="300" y="66" font-family="'Manrope',sans-serif" font-size="40" font-weight="800" fill="#f6ded3">₹</text>
    </g>
  </g>
  <text transform="translate(72 476)" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="0.4" fill="#9a6a52">Rates &amp; caps are set by NHA notification — confirm the current scheme on abdm.gov.in.</text>
</svg>
