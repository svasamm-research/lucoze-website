<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="DPDP 2023 for a clinic in four duties: tell patients what you collect, get explicit consent, secure the data, and honour patient rights — plus notify on a breach.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>

  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">DPDP · DATA PROTECTION</text>
  </g>

  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">DPDP 2023, in four duties.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">What a clinic actually owes under the Digital Personal Data Protection Act.</text>
  </g>

  <!-- four numbered duty cards -->
  <g transform="translate(72 262)" font-family="'Manrope',sans-serif">
    <!-- card template repeated -->
    <g transform="translate(0 0)">
      <rect width="255" height="150" rx="14" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="34" cy="40" r="18" fill="#c15f3c"/>
      <text x="34" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">1</text>
      <text x="66" y="46" font-size="19" font-weight="800" fill="#1f1d1a">Tell</text>
      <text x="24" y="86" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">A notice at the front desk:</text>
      <text x="24" y="108" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">what you collect, and why.</text>
    </g>
    <g transform="translate(283 0)">
      <rect width="255" height="150" rx="14" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="34" cy="40" r="18" fill="#c15f3c"/>
      <text x="34" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">2</text>
      <text x="66" y="46" font-size="19" font-weight="800" fill="#1f1d1a">Consent</text>
      <text x="24" y="86" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">Explicit, before sharing —</text>
      <text x="24" y="108" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">labs, insurers, anyone.</text>
    </g>
    <g transform="translate(566 0)">
      <rect width="255" height="150" rx="14" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="34" cy="40" r="18" fill="#c15f3c"/>
      <text x="34" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3</text>
      <text x="66" y="46" font-size="19" font-weight="800" fill="#1f1d1a">Secure</text>
      <text x="24" y="86" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">Protect the records you</text>
      <text x="24" y="108" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">hold. Breach? Notify.</text>
    </g>
    <g transform="translate(849 0)">
      <rect width="255" height="150" rx="14" fill="#c15f3c"/>
      <circle cx="34" cy="40" r="18" fill="#fff"/>
      <text x="34" y="46" text-anchor="middle" font-size="18" font-weight="800" fill="#c15f3c">4</text>
      <text x="66" y="46" font-size="19" font-weight="800" fill="#fff">Rights</text>
      <text x="24" y="86" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#f6ded3">Let patients access,</text>
      <text x="24" y="108" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#f6ded3">correct and delete data.</text>
    </g>
  </g>
</svg>
