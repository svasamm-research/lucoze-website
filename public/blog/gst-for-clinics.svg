<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="One clinic invoice carries two tax rules: the consultation line is GST-exempt, the pharmacy medicines line is taxable at 5%.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>

  <!-- eyebrow -->
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">BILLING &amp; GST</text>
  </g>

  <!-- title -->
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">One invoice, two tax rules.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">A single clinic visit mixes an exempt line and a taxable line. The bill has to carry both.</text>
  </g>

  <!-- invoice card -->
  <g transform="translate(365 250)">
    <rect x="0" y="0" width="470" height="292" rx="16" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
    <text x="28" y="42" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="1.5" fill="#9c9488">INVOICE · ONE VISIT</text>
    <line x1="28" y1="58" x2="442" y2="58" stroke="#eee9df"/>

    <!-- exempt row -->
    <g transform="translate(28 80)">
      <rect x="0" y="0" width="414" height="72" rx="10" fill="#f4f2ea" stroke="#e2e0d8"/>
      <text x="18" y="30" font-family="'Manrope',sans-serif" font-size="18" font-weight="700" fill="#1f1d1a">Consultation</text>
      <text x="18" y="54" font-family="'Inter Tight',sans-serif" font-size="14" fill="#726d65">Healthcare service</text>
      <rect x="300" y="20" width="96" height="34" rx="17" fill="#efe7e0" stroke="#d9cdc2"/>
      <text x="348" y="42" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#7a6f64">EXEMPT</text>
    </g>

    <!-- taxable row -->
    <g transform="translate(28 164)">
      <rect x="0" y="0" width="414" height="72" rx="10" fill="#fbeee7" stroke="#e8c7b6"/>
      <text x="18" y="30" font-family="'Manrope',sans-serif" font-size="18" font-weight="700" fill="#1f1d1a">Medicines</text>
      <text x="18" y="54" font-family="'Inter Tight',sans-serif" font-size="14" fill="#9a6a52">Pharmacy counter · HSN Ch. 30</text>
      <rect x="300" y="20" width="96" height="34" rx="17" fill="#c15f3c"/>
      <text x="348" y="42" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#fff">GST 5%</text>
    </g>
  </g>

</svg>
