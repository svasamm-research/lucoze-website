<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="A single pharmacy invoice line carries four things at once: the Schedule-H flag, the batch and expiry, the HSN Chapter 30 code, and the 5 percent GST rate.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">BILLING &amp; GST · PHARMACY</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">One pharmacy line, four rules.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">Every medicine sold has to satisfy drug law and tax law on the same row.</text>
  </g>
  <!-- invoice line with callouts -->
  <g transform="translate(72 300)" font-family="'Manrope',sans-serif">
    <rect x="0" y="40" width="1032" height="70" rx="12" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
    <text x="24" y="82" font-size="19" font-weight="800" fill="#1f1d1a">Amoxicillin 500mg × 10</text>
    <text x="880" y="82" font-size="19" font-weight="800" fill="#1f1d1a" text-anchor="end">₹  ___</text>

    <!-- four tags below -->
    <g font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="700" letter-spacing="0.4">
      <g transform="translate(24 140)"><rect width="150" height="38" rx="19" fill="#fbeee7" stroke="#e8c7b6"/><text x="75" y="24" text-anchor="middle" fill="#9a4526">SCHEDULE H</text></g>
      <g transform="translate(190 140)"><rect width="190" height="38" rx="19" fill="#f4f2ea" stroke="#e2e0d8"/><text x="95" y="24" text-anchor="middle" fill="#625c54">BATCH · EXPIRY</text></g>
      <g transform="translate(396 140)"><rect width="150" height="38" rx="19" fill="#f4f2ea" stroke="#e2e0d8"/><text x="75" y="24" text-anchor="middle" fill="#625c54">HSN CH. 30</text></g>
      <g transform="translate(562 140)"><rect width="110" height="38" rx="19" fill="#c15f3c"/><text x="55" y="24" text-anchor="middle" fill="#fff">GST 5%</text></g>
    </g>
    <text x="24" y="212" font-family="'Inter Tight',sans-serif" font-size="15" fill="#726d65">Get any one wrong and the invoice is non-compliant — or the stock count drifts.</text>
  </g>
</svg>
