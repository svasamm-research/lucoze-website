<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Getting paid under PMJAY and state health schemes, in four steps: pre-authorise the package, treat the patient, file the claim with documents, and receive payment at the package rate.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">BILLING · PMJAY &amp; SCHEMES</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">Getting paid under PMJAY.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">Package rates and pre-auth — the sequence that keeps scheme claims clean.</text>
  </g>
  <g transform="translate(72 300)" font-family="'Manrope',sans-serif">
    <line x1="128" y1="70" x2="1050" y2="70" stroke="#d9cabb" stroke-width="2" stroke-dasharray="2 8"/>
    <g transform="translate(0 0)">
      <rect width="250" height="140" rx="14" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="36" cy="42" r="19" fill="#c15f3c"/><text x="36" y="49" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text>
      <text x="24" y="92" font-size="18" font-weight="800" fill="#1f1d1a">Pre-authorise</text>
      <text x="24" y="118" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">Package approved first</text>
    </g>
    <g transform="translate(283 0)">
      <rect width="250" height="140" rx="14" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="36" cy="42" r="19" fill="#c15f3c"/><text x="36" y="49" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text>
      <text x="24" y="92" font-size="18" font-weight="800" fill="#1f1d1a">Treat</text>
      <text x="24" y="118" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">Within the package</text>
    </g>
    <g transform="translate(566 0)">
      <rect width="250" height="140" rx="14" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <circle cx="36" cy="42" r="19" fill="#c15f3c"/><text x="36" y="49" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text>
      <text x="24" y="92" font-size="18" font-weight="800" fill="#1f1d1a">Claim</text>
      <text x="24" y="118" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#625c54">File with documents</text>
    </g>
    <g transform="translate(849 0)">
      <rect width="250" height="140" rx="14" fill="#c15f3c"/>
      <circle cx="36" cy="42" r="19" fill="#fff"/><text x="36" y="49" text-anchor="middle" font-size="19" font-weight="800" fill="#c15f3c">4</text>
      <text x="24" y="92" font-size="18" font-weight="800" fill="#fff">Paid</text>
      <text x="24" y="118" font-family="'Inter Tight',sans-serif" font-size="14.5" fill="#f6ded3">At the package rate</text>
    </g>
  </g>
</svg>
