<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Three clinic tools, three different centres of gravity: Practo Ray is booking-and-discovery first, Halemind is enterprise HIS, and Lucoze is an India-first clinic operating system.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">BUYING GUIDE · HONEST COMPARISON</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">Three tools, three centres of gravity.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">Each is built around a different job. The question is which job is yours.</text>
  </g>
  <g transform="translate(72 288)" font-family="'Manrope',sans-serif">
    <g transform="translate(0 0)">
      <rect width="316" height="184" rx="16" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <text x="28" y="52" font-size="23" font-weight="800" fill="#1f1d1a">Practo Ray</text>
      <text x="28" y="82" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="0.6" fill="#c15f3c">BOOKING-FIRST</text>
      <text x="28" y="120" font-family="'Inter Tight',sans-serif" font-size="15" fill="#625c54">Discovery &amp; appointments,</text>
      <text x="28" y="142" font-family="'Inter Tight',sans-serif" font-size="15" fill="#625c54">tied to a patient marketplace.</text>
    </g>
    <g transform="translate(360 0)">
      <rect width="316" height="184" rx="16" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <text x="28" y="52" font-size="23" font-weight="800" fill="#1f1d1a">Halemind</text>
      <text x="28" y="82" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="0.6" fill="#c15f3c">ENTERPRISE HIS</text>
      <text x="28" y="120" font-family="'Inter Tight',sans-serif" font-size="15" fill="#625c54">Broad hospital modules,</text>
      <text x="28" y="142" font-family="'Inter Tight',sans-serif" font-size="15" fill="#625c54">heavier to set up and run.</text>
    </g>
    <g transform="translate(720 0)">
      <rect width="316" height="184" rx="16" fill="#c15f3c"/>
      <text x="28" y="52" font-size="23" font-weight="800" fill="#fff">Lucoze</text>
      <text x="28" y="82" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="0.6" fill="#f6d9cd">INDIA-FIRST CLINIC OS</text>
      <text x="28" y="120" font-family="'Inter Tight',sans-serif" font-size="15" fill="#f6ded3">ABDM, GST, Hindi, data in</text>
      <text x="28" y="142" font-family="'Inter Tight',sans-serif" font-size="15" fill="#f6ded3">India — built for the desk.</text>
    </g>
  </g>
</svg>
