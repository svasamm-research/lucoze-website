<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="An HPR card under ABDM: a doctor's name, specialty, medical council registration, a verified HPR ID.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">ABDM · HEALTHCARE PROFESSIONALS REGISTRY</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">Your doctors' ID on ABDM.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">HFR registers the hospital. HPR registers the clinicians — each gets a verified HPR ID.</text>
  </g>
  <g transform="translate(320 262)">
    <rect x="0" y="0" width="560" height="248" rx="18" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
    <rect x="0" y="0" width="560" height="60" rx="18" fill="#1f1d1a"/><rect x="0" y="30" width="560" height="30" fill="#1f1d1a"/>
    <text x="28" y="38" font-family="'JetBrains Mono',monospace" font-size="14" letter-spacing="1.5" fill="#f4f3ee">HEALTHCARE PROFESSIONALS REGISTRY</text>
    <g transform="translate(460 18)">
      <rect x="0" y="0" width="76" height="26" rx="13" fill="#2f6b3f"/>
      <path d="M14 13 l4 4 l8 -9" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="18" font-family="'JetBrains Mono',monospace" font-size="11" font-weight="700" fill="#fff">VERIFIED</text>
    </g>
    <!-- doctor avatar -->
    <g transform="translate(30 92)">
      <rect x="0" y="0" width="72" height="72" rx="12" fill="#fbeee7" stroke="#e8c7b6"/>
      <circle cx="36" cy="30" r="13" fill="none" stroke="#c15f3c" stroke-width="3"/>
      <path d="M16 60 a20 16 0 0 1 40 0" fill="none" stroke="#c15f3c" stroke-width="3"/>
    </g>
    <text x="122" y="120" font-family="'Manrope',sans-serif" font-size="26" font-weight="800" fill="#1f1d1a">Dr. Ananya Sen</text>
    <text x="122" y="150" font-family="'Inter Tight',sans-serif" font-size="16" fill="#625c54">Cardiology · Council reg. WBMC-2011-04872</text>
    <line x1="30" y1="186" x2="530" y2="186" stroke="#eee9df"/>
    <text x="30" y="216" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1" fill="#9a8f80">HPR ID</text>
    <text x="30" y="238" font-family="'JetBrains Mono',monospace" font-size="22" font-weight="700" fill="#c15f3c">72-1140-8265-9930</text>
  </g>
</svg>
