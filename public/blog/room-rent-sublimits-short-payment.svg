<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Why a cashless-approved bill still gets paid short: when the room rent exceeds the policy sub-limit, the insurer applies that same ratio proportionately to every associated charge.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">BILLING · PROPORTIONATE DEDUCTION</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">Approved, but paid short.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">Cross the room-rent sub-limit and the insurer scales <tspan font-style="italic">every</tspan> charge by the same ratio.</text>
  </g>
  <!-- room rent vs sub-limit + proportion applied -->
  <g transform="translate(72 288)" font-family="'Manrope',sans-serif">
    <!-- room rent bar -->
    <text x="0" y="16" font-family="'Inter Tight',sans-serif" font-size="15" fill="#625c54">Room booked</text>
    <rect x="0" y="26" width="420" height="40" rx="8" fill="#c15f3c"/>
    <text x="16" y="52" font-size="16" font-weight="800" fill="#fff">₹ 6,000 / day</text>

    <text x="0" y="102" font-family="'Inter Tight',sans-serif" font-size="15" fill="#625c54">Policy sub-limit</text>
    <rect x="0" y="112" width="280" height="40" rx="8" fill="#e5ddd0"/>
    <text x="16" y="138" font-size="16" font-weight="800" fill="#7a6f62">₹ 4,000 / day</text>
    <line x1="280" y1="20" x2="280" y2="160" stroke="#1f1d1a" stroke-width="1.5" stroke-dasharray="3 5"/>

    <!-- ratio callout -->
    <g transform="translate(470 40)">
      <rect width="180" height="112" rx="14" fill="#1f1d1a"/>
      <text x="90" y="44" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" letter-spacing="1" fill="#c9a68f">PAID RATIO</text>
      <text x="90" y="88" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">67%</text>
    </g>
    <text transform="translate(672 104)" font-size="30" fill="#c9a68f">→</text>

    <!-- applied to whole bill -->
    <g transform="translate(730 26)">
      <rect width="352" height="140" rx="16" fill="#fbeee7" stroke="#e8c7b6" stroke-width="1.5"/>
      <text x="26" y="44" font-size="19" font-weight="800" fill="#9a4526">Every line × 0.67</text>
      <text x="26" y="78" font-family="'Inter Tight',sans-serif" font-size="15" fill="#9a6a52">Surgeon, ICU, tests, consumables —</text>
      <text x="26" y="102" font-family="'Inter Tight',sans-serif" font-size="15" fill="#9a6a52">not just the room. The whole bill</text>
      <text x="26" y="126" font-family="'Inter Tight',sans-serif" font-size="15" fill="#9a6a52">is deducted proportionately.</text>
    </g>
  </g>
</svg>
