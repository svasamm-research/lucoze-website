<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Switching from Practo Ray to Lucoze in fourteen days: export and map data in days one to three, run both systems in parallel through day eleven, then cut over in days twelve to fourteen.">
  <rect width="1200" height="600" fill="#f4f3ee"/>
  <rect x="0" y="0" width="14" height="600" fill="#c15f3c"/>
  <g transform="translate(72 56)">
    <rect x="0" y="0" width="50" height="50" rx="11" fill="#c15f3c"/>
    <circle cx="15" cy="15" r="3.9" fill="#f4f3ee"/><circle cx="15" cy="25" r="3.9" fill="#f4f3ee"/>
    <circle cx="15" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="25" cy="35" r="3.9" fill="#f4f3ee"/><circle cx="35" cy="35" r="3.9" fill="#f4f3ee"/>
    <text x="66" y="21" font-family="'JetBrains Mono',monospace" font-size="14" font-weight="700" letter-spacing="2.2" fill="#c15f3c">LUCOZE</text>
    <text x="66" y="42" font-family="'JetBrains Mono',monospace" font-size="12.5" letter-spacing="1.3" fill="#726d65">SWITCHING · FROM PRACTO RAY</text>
  </g>
  <g transform="translate(72 168)" font-family="'Manrope','Inter Tight',sans-serif">
    <text x="0" y="0" font-size="50" font-weight="800" letter-spacing="-1.6" fill="#1f1d1a">Practo Ray to Lucoze, 14 days.</text>
    <text x="0" y="40" font-size="20" fill="#625c54">A rehearsed migration with a fixed end date — and the clinic open throughout.</text>
  </g>
  <!-- 14-day timeline in 3 phases -->
  <g transform="translate(72 320)" font-family="'Manrope',sans-serif">
    <g font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="0.5" fill="#8a8073">
      <text x="0" y="0">DAYS 1–3</text><text x="360" y="0">DAYS 4–11</text><text x="800" y="0">DAYS 12–14</text>
    </g>
    <g transform="translate(0 18)">
      <rect x="0" y="0" width="332" height="70" rx="12" fill="#fffdf7" stroke="#e2e0d8" stroke-width="1.5"/>
      <text x="22" y="32" font-size="18" font-weight="800" fill="#1f1d1a">Export &amp; map</text>
      <text x="22" y="56" font-family="'Inter Tight',sans-serif" font-size="14" fill="#625c54">Pull data, match fields</text>
    </g>
    <g transform="translate(360 18)">
      <rect x="0" y="0" width="412" height="70" rx="12" fill="#f4f2ea" stroke="#d9cabb" stroke-width="1.5"/>
      <text x="22" y="32" font-size="18" font-weight="800" fill="#1f1d1a">Parallel run</text>
      <text x="22" y="56" font-family="'Inter Tight',sans-serif" font-size="14" fill="#625c54">Both live — staff train, data verified</text>
    </g>
    <g transform="translate(800 18)">
      <rect x="0" y="0" width="284" height="70" rx="12" fill="#c15f3c"/>
      <text x="22" y="32" font-size="18" font-weight="800" fill="#fff">Cut over</text>
      <text x="22" y="56" font-family="'Inter Tight',sans-serif" font-size="14" fill="#f6ded3">Practo off, Lucoze live</text>
    </g>
    <!-- baseline -->
    <line x1="0" y1="104" x2="1084" y2="104" stroke="#d9cabb" stroke-width="2"/>
    <circle cx="0" cy="104" r="5" fill="#8a8073"/>
    <circle cx="1084" cy="104" r="6" fill="#c15f3c"/>
    <text x="1030" y="128" font-family="'JetBrains Mono',monospace" font-size="12" fill="#9a6a52">DAY 14</text>
  </g>
</svg>
