<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
			}
			#stage {
				width: 1200px;
				height: 600px;
			}
		</style>
	</head>
	<body>
		<div id="stage">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				viewBox="0 0 1200 600"
				width="1200"
				height="600"
				role="img"
				aria-label="A precarious stack of paper registers and loose patient records on a clinic desk — the hidden cost of paper."
			>
				<defs>
					<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
						<stop offset="0" stop-color="#f6f4ee" />
						<stop offset="1" stop-color="#e9e1d2" />
					</linearGradient>
					<linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
						<stop offset="0" stop-color="#e2d7c2" />
						<stop offset="1" stop-color="#d2c3a7" />
					</linearGradient>
					<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
						<feGaussianBlur stdDeviation="6" />
					</filter>
				</defs>

				<!-- ground -->
				<rect width="1200" height="600" fill="url(#bg)" />
				<rect x="0" y="0" width="14" height="600" fill="#c15f3c" />

				<!-- faint rupee watermark: the 'cost' -->
				<text
					x="1050"
					y="330"
					font-family="Georgia, serif"
					font-size="440"
					font-weight="700"
					fill="#c15f3c"
					opacity="0.06"
					text-anchor="middle"
				>
					₹
				</text>

				<!-- eyebrow: vault mark + label -->
				<g transform="translate(72 60)">
					<rect x="0" y="0" width="50" height="50" rx="11" ry="11" fill="#c15f3c" />
					<circle cx="15" cy="15" r="3.9" fill="#f6f4ee" />
					<circle cx="15" cy="25" r="3.9" fill="#f6f4ee" />
					<circle cx="15" cy="35" r="3.9" fill="#f6f4ee" />
					<circle cx="25" cy="35" r="3.9" fill="#f6f4ee" />
					<circle cx="35" cy="35" r="3.9" fill="#f6f4ee" />
					<text
						x="66"
						y="22"
						font-family="'JetBrains Mono', monospace"
						font-size="14"
						font-weight="700"
						letter-spacing="2.2"
						fill="#c15f3c"
					>
						LUCOZE
					</text>
					<text
						x="66"
						y="43"
						font-family="'JetBrains Mono', monospace"
						font-size="12.5"
						letter-spacing="1.3"
						fill="#8a7f6d"
					>
						FIELD NOTES · THE COST OF PAPER
					</text>
				</g>

				<!-- desk surface -->
				<rect x="0" y="470" width="1200" height="130" fill="url(#desk)" />
				<rect x="0" y="470" width="1200" height="5" fill="#c9b795" />

				<!-- shadows -->
				<ellipse
					cx="360"
					cy="474"
					rx="200"
					ry="20"
					fill="#1f1d1a"
					opacity="0.10"
					filter="url(#soft)"
				/>
				<ellipse
					cx="720"
					cy="476"
					rx="150"
					ry="16"
					fill="#1f1d1a"
					opacity="0.09"
					filter="url(#soft)"
				/>

				<!-- tall register stack (slightly askew, precarious) -->
				<g transform="translate(250 210)">
					<!-- each register: cover + page edge -->
					<g transform="translate(6 250) rotate(-2)">
						<rect x="0" y="0" width="230" height="34" rx="3" fill="#fbf8f0" stroke="#e2d9c8" />
						<rect x="0" y="0" width="230" height="34" rx="3" fill="none" stroke="#e2d9c8" />
						<rect x="0" y="0" width="12" height="34" fill="#a8865f" />
						<line x1="24" y1="9" x2="210" y2="9" stroke="#e6ddca" stroke-width="1.5" />
						<line x1="24" y1="17" x2="210" y2="17" stroke="#e6ddca" stroke-width="1.5" />
						<line x1="24" y1="25" x2="180" y2="25" stroke="#e6ddca" stroke-width="1.5" />
					</g>
					<g transform="translate(-4 214) rotate(1.5)">
						<rect x="0" y="0" width="238" height="38" rx="3" fill="#c15f3c" />
						<rect x="0" y="0" width="14" height="38" fill="#9c4526" />
						<text
							x="130"
							y="24"
							font-family="'JetBrains Mono', monospace"
							font-size="12"
							fill="#f6e6dd"
							text-anchor="middle"
							letter-spacing="1"
						>
							OPD REGISTER '24
						</text>
					</g>
					<g transform="translate(10 180) rotate(-1)">
						<rect x="0" y="0" width="224" height="36" rx="3" fill="#fbf8f0" stroke="#e2d9c8" />
						<rect x="0" y="0" width="12" height="36" fill="#b9542f" />
						<line x1="24" y1="10" x2="204" y2="10" stroke="#e6ddca" stroke-width="1.5" />
						<line x1="24" y1="19" x2="204" y2="19" stroke="#e6ddca" stroke-width="1.5" />
						<line x1="24" y1="28" x2="170" y2="28" stroke="#e6ddca" stroke-width="1.5" />
					</g>
					<g transform="translate(2 146) rotate(2)">
						<rect x="0" y="0" width="232" height="36" rx="3" fill="#e7d9c1" stroke="#d6c4a4" />
						<rect x="0" y="0" width="12" height="36" fill="#a8865f" />
					</g>
					<g transform="translate(-2 112) rotate(-2.5)">
						<rect x="0" y="0" width="236" height="36" rx="3" fill="#c15f3c" />
						<rect x="0" y="0" width="14" height="36" fill="#9c4526" />
						<text
							x="130"
							y="23"
							font-family="'JetBrains Mono', monospace"
							font-size="12"
							fill="#f6e6dd"
							text-anchor="middle"
							letter-spacing="1"
						>
							BILLING · CASH BOOK
						</text>
					</g>
					<g transform="translate(14 80) rotate(3.5)">
						<rect x="0" y="0" width="220" height="34" rx="3" fill="#fbf8f0" stroke="#e2d9c8" />
						<rect x="0" y="0" width="12" height="34" fill="#b9542f" />
						<line x1="24" y1="10" x2="198" y2="10" stroke="#e6ddca" stroke-width="1.5" />
						<line x1="24" y1="19" x2="160" y2="19" stroke="#e6ddca" stroke-width="1.5" />
					</g>
				</g>

				<!-- shorter folder stack, right -->
				<g transform="translate(600 300)">
					<g transform="translate(0 150) rotate(2)">
						<rect x="0" y="0" width="250" height="40" rx="4" fill="#cf7a56" />
						<path d="M0 0 h90 l14 -16 h60 v16" fill="#d98a68" />
					</g>
					<g transform="translate(10 120) rotate(-1.5)">
						<rect x="0" y="0" width="240" height="34" rx="3" fill="#fbf8f0" stroke="#e2d9c8" />
						<line x1="18" y1="11" x2="215" y2="11" stroke="#e6ddca" stroke-width="1.5" />
						<line x1="18" y1="21" x2="180" y2="21" stroke="#e6ddca" stroke-width="1.5" />
					</g>
					<g transform="translate(4 92) rotate(1)">
						<rect x="0" y="0" width="246" height="34" rx="3" fill="#e7d9c1" stroke="#d6c4a4" />
					</g>
				</g>

				<!-- loose sheets slipping / falling: the leak -->
				<g opacity="0.96">
					<g transform="translate(470 250) rotate(18)">
						<rect x="0" y="0" width="120" height="150" rx="4" fill="#fffdf7" stroke="#e2e0d8" />
						<line x1="16" y1="24" x2="104" y2="24" stroke="#e6ddca" stroke-width="2" />
						<line x1="16" y1="40" x2="104" y2="40" stroke="#e6ddca" stroke-width="2" />
						<line x1="16" y1="56" x2="84" y2="56" stroke="#e6ddca" stroke-width="2" />
						<line x1="16" y1="86" x2="104" y2="86" stroke="#eee7d6" stroke-width="2" />
						<line x1="16" y1="102" x2="70" y2="102" stroke="#eee7d6" stroke-width="2" />
					</g>
					<g transform="translate(430 360) rotate(-12)">
						<rect x="0" y="0" width="110" height="140" rx="4" fill="#fdfbf4" stroke="#e2e0d8" />
						<line x1="15" y1="22" x2="95" y2="22" stroke="#e9e0cf" stroke-width="2" />
						<line x1="15" y1="37" x2="95" y2="37" stroke="#e9e0cf" stroke-width="2" />
						<line x1="15" y1="52" x2="72" y2="52" stroke="#e9e0cf" stroke-width="2" />
					</g>
					<g transform="translate(548 300) rotate(32)">
						<rect x="0" y="0" width="96" height="122" rx="4" fill="#fffdf7" stroke="#e6e3da" />
						<line x1="13" y1="20" x2="83" y2="20" stroke="#ece4d3" stroke-width="2" />
						<line x1="13" y1="34" x2="66" y2="34" stroke="#ece4d3" stroke-width="2" />
					</g>
				</g>
			</svg>
		</div>
	</body>
</html>
